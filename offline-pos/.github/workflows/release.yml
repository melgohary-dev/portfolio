name: Release desktop installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Package installers
        env:
          # Build unsigned: no Apple/Windows signing certs in CI by default.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: offlinepos-${{ matrix.artifact }}
          path: release/*

  smoke:
    name: Smoke test (Linux)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offlinepos-linux
          path: release
      - name: Run AppImage smoke test
        run: |
          chmod +x release/*.AppImage
          xvfb-run -a ./release/*.AppImage \
            --appimage-extract-and-run \
            --no-sandbox \
            --smoke-test
